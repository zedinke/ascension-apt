Type: desktop-application
ID: live.ascension.epic
Package: ascension-epic
ProjectLicense: LicenseRef-proprietary
Name:
  C: Epic Games Store
Summary:
  C: Az Epic Games Store Wine alatt — az első indítás telepíti
Description:
  C: >-
    <p>
          Az Epic Games Store üzembe helyezése Wine alatt: létrehozza a Wine
          prefixet, felteszi a szükséges betűkészleteket, majd letölti és
          telepíti az Epic hivatalos telepítőjét.
        </p>
    <p>
          Ez a csomag magát az Epic Games Store-t NEM tartalmazza — azt az
          első indításkor tölti le az Epic saját szerveréről. Ehhez
          internetkapcsolat kell, és a művelet néhány percig tart; addig egy
          terminálablak mutatja, hol jár. A későbbi indítások már közvetlenül
          a launchert nyitják meg.
        </p>
    <p>
          Az Epic Online Services telepítéséről is gondoskodik, ami a
          crossplayhez, a teljesítményekhez és az overlayhez kell. Ennek
          telepítőjét a launcher tölti le az első önfrissítésekor, ezért az
          Epic Online Services a soron következő indításkor kerül fel — nem
          rögtön az elsőnél.
        </p>
    <p>
          A játékok és a Wine prefix alapértelmezés szerint a felhasználó
          Games könyvtárába kerülnek. Ha a rendszerlemez kicsi, ez átállítható
          az /etc/ascension/epic.conf fájlban, vagy felhasználónként a
          ~/.config/ascension/epic.conf fájlban, az ASCENSION_GAMES_DIR
          értékével.
        </p>
    <p>
          Az Ascension Linux nem áll kapcsolatban az Epic Games, Inc.
          vállalattal, és nem is terjeszti a szoftverét; ez a csomag csak a
          Linux alatti üzembe helyezést végzi el.
        </p>
