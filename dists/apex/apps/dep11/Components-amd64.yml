Description:
  C: >-
    <p>
          Asztali kliens játékszerverek üzemeltetéséhez: szerverek indítása és
          leállítása, beállítások, mentések, ütemezett feladatok és naplók egy
          felületen. A gépeket a Manager készíti fel és tartja karban — nincs
          szükség kézi SSH-munkamenetre vagy Linux-ismeretre hozzá.
        </p>
    <p>
          A szervergépeken futó összetevők (ügynök, ütemező, központi API) külön
          részei a rendszernek; ez az alkalmazás a kezelőfelület.
        </p>
